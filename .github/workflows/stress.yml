name: Stress check (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python build/fetch_tools.py

      - name: Big library with emoji / CJK on a real screen
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -u tests/stress_library.py 1600 2>&1 | Out-String -Stream
          if ($LASTEXITCODE -ne 0) { throw "stress failed: $LASTEXITCODE" }

      - name: Playback - old setup (Python faulthandler + mpv scripts) to show the cause
        shell: pwsh
        env:
          NIRVASH_OLD_CRASHLOG: "1"
          NIRVASH_MPV_SCRIPTS: "1"
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -u tests/playback_stress.py 2>&1 | Out-String -Stream | Select-Object -Last 8
          "old setup exit: $LASTEXITCODE"
          exit 0

      - name: Playback - current code, 3 runs
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          foreach ($i in 1..3) {
            python -u tests/playback_stress.py 2>&1 | Out-String -Stream | ForEach-Object { "$(Get-Date -Format HH:mm:ss) $_" }
            if ($LASTEXITCODE -ne 0) { throw "playback run $i failed: $LASTEXITCODE" }
          }

      # Full page heap: any use of freed memory crashes at once instead of by luck.
      - name: Turn on full page heap for python.exe
        shell: pwsh
        run: |
          $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null

      - name: Page heap - current code, library stress + all UI flows
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -u tests/stress_library.py 300 2>&1 | Out-String -Stream | Where-Object { $_ -notmatch "font.db" } | ForEach-Object { "$(Get-Date -Format HH:mm:ss) $_" }
          if ($LASTEXITCODE -ne 0) { throw "stress crashed under page heap: $LASTEXITCODE" }
          python -u tests/playback_stress.py 2>&1 | Out-String -Stream | ForEach-Object { "$(Get-Date -Format HH:mm:ss) $_" }
          if ($LASTEXITCODE -ne 0) { throw "playback crashed under page heap: $LASTEXITCODE" }
          python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=900 tests/test_ui_flows.py tests/test_ownership.py tests/test_library_ui.py tests/test_library_ops.py
          if ($LASTEXITCODE -ne 0) { throw "UI tests failed under page heap" }
