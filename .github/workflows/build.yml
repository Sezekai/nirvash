name: Build Nirvash

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 pytest

      - name: Download FFmpeg, libmpv and fpcalc
        run: python build/fetch_tools.py

      - name: Tests (lossless pipeline on generated videos)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -m pytest -q tests/test_pipeline.py

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nvroot/Models
          key: models-ast-clip-b32-v1

      - name: Tests (real audio tagger / CLIP / lookups)
        shell: pwsh
        env:
          NIRVASH_MODEL_TESTS: "1"
          NIRVASH_ROOT: ${{ runner.temp }}/nvroot
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -m pytest -q -s tests/test_models.py

      - name: UI smoke test with real playback (screenshots)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python tests/screenshots.py "$PWD\shots"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: shots
          retention-days: 7

      - name: Build app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/nirvash.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\App\Nirvash.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Nirvash | Out-Null
          Copy-Item -Recurse dist/App out/Nirvash/App
          Copy-Item README.md out/Nirvash/README.txt
          Compress-Archive -Path out/Nirvash -DestinationPath "Nirvash-${{ github.ref_name }}.zip" -CompressionLevel Optimal
          Get-Item "Nirvash-*.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Nirvash-${{ github.ref_name }}-${{ github.run_number }}
          path: out/Nirvash
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nirvash-${{ github.ref_name }}.zip
          generate_release_notes: true
