name: Build Nirvash

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 pytest

      - name: Download FFmpeg, libmpv and fpcalc
        run: python build/fetch_tools.py

      - name: Tests (lossless pipeline on generated videos)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $env:NIRVASH_AUTO_DIALOGS = "accept"
          python -X faulthandler -m pytest -q tests/test_pipeline.py tests/test_download.py tests/test_ui_flows.py tests/test_processes.py tests/test_ownership.py tests/test_library_ops.py tests/test_library_ui.py tests/test_audio_edit.py tests/test_editor.py tests/test_editor_ui.py
          $a = $LASTEXITCODE; "main tests exit: $a"
          python -X faulthandler -m pytest -q -rs tests/test_shell.py
          $b = $LASTEXITCODE; "shell tests exit: $b"
          # the real window frame, on the runner's desktop rather than offscreen
          $env:QT_QPA_PLATFORM = "windows"
          python -X faulthandler -m pytest -q -rs tests/test_shell.py -k windows_frame
          $c = $LASTEXITCODE; "window frame test exit: $c"
          if ($a -ne 0 -or $b -ne 0 -or $c -ne 0) { exit 1 }

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nvroot/Models
          key: models-ast-clip-b32-v1

      - name: Tests (real audio tagger / CLIP / lookups)
        shell: pwsh
        env:
          NIRVASH_MODEL_TESTS: "1"
          NIRVASH_ROOT: ${{ runner.temp }}/nvroot
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -m pytest -q -s tests/test_models.py

      - name: UI smoke test with real playback (screenshots)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -u tests/mpv_smoke.py raw 2>&1 | Out-String -Stream
          "raw exit: $LASTEXITCODE"
          python -u tests/mpv_smoke.py full 2>&1 | Out-String -Stream
          "full exit: $LASTEXITCODE"
          python -u tests/screenshots.py "$PWD\shots" 2>&1 | Out-String -Stream
          "exit code: $LASTEXITCODE"

      - name: Build app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/nirvash.spec

      - name: Self-test the built app
        timeout-minutes: 6
        shell: pwsh
        run: |
          # wait for Nirvash itself (-Wait would also wait for anything it started)
          $p = Start-Process -FilePath "dist\App\Nirvash.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -PassThru
          if (-not $p.WaitForExit(240000)) { "Nirvash is still running after 4 minutes"; $p.Kill() }
          Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | Select-Object ProcessId, Name, CommandLine | Format-List
          Get-Content selftest.json
          if (Test-Path selftest.json.hang.txt) { Get-Content selftest.json.hang.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (Select-String -Path nirvash/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out/Nirvash | Out-Null
          Copy-Item -Recurse dist/App out/Nirvash/App
          Copy-Item README.md out/Nirvash/README.txt
          Compress-Archive -Path out/Nirvash -DestinationPath "Nirvash.zip" -CompressionLevel Optimal
          Get-Item "Nirvash.zip" | Select-Object Name, Length

      # Numbered releases (STANDARDS.md): each version gets its own tag and release, kept for going back.
      # Pushing again without a new version replaces that version's zip. The newest is always at
      # https://github.com/Sezekai/nirvash/releases/latest/download/Nirvash.zip
      - name: Tag this version
        if: github.event_name != 'release'
        shell: pwsh
        run: |
          $tag = "v${{ steps.pkg.outputs.version }}"
          git tag -f $tag
          git push -f origin $tag
          # the old rolling "latest" release is replaced by numbered ones
          gh release delete latest --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0

      - name: Publish this version
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Nirvash ${{ steps.pkg.outputs.version }}
          body: |
            Nirvash ${{ steps.pkg.outputs.version }} (build ${{ github.run_number }}, ${{ github.sha }}).
            Extract `Nirvash.zip` into `E:\Pictures` so the program sits at `E:\Pictures\Nirvash\App\Nirvash.exe`.
            Your settings, library and models are kept: they live outside the App folder.
          files: Nirvash.zip
          overwrite_files: true
          make_latest: true

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Nirvash.zip
