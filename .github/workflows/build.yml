name: Build Nirvash

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 pytest

      - name: Download FFmpeg, libmpv and fpcalc
        run: python build/fetch_tools.py

      - name: Tests (lossless pipeline on generated videos)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -m pytest -q tests/test_pipeline.py tests/test_download.py

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nvroot/Models
          key: models-ast-clip-b32-v1

      - name: Tests (real audio tagger / CLIP / lookups)
        shell: pwsh
        env:
          NIRVASH_MODEL_TESTS: "1"
          NIRVASH_ROOT: ${{ runner.temp }}/nvroot
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -m pytest -q -s tests/test_models.py

      - name: UI smoke test with real playback (screenshots)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -u -X faulthandler tests/mpv_smoke.py raw 2>&1 | Out-String -Stream
          "raw exit: $LASTEXITCODE"
          python -u -X faulthandler tests/mpv_smoke.py full 2>&1 | Out-String -Stream
          "full exit: $LASTEXITCODE"
          python -u -X faulthandler tests/screenshots.py "$PWD\shots" 2>&1 | Out-String -Stream
          "exit code: $LASTEXITCODE"

      - name: Build app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/nirvash.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\App\Nirvash.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (Select-String -Path nirvash/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out/Nirvash | Out-Null
          Copy-Item -Recurse dist/App out/Nirvash/App
          Copy-Item README.md out/Nirvash/README.txt
          Compress-Archive -Path out/Nirvash -DestinationPath "Nirvash.zip" -CompressionLevel Optimal
          Get-Item "Nirvash.zip" | Select-Object Name, Length

      # Builds go to a GitHub release (no storage quota), not to Actions artifacts.
      - name: Point the "latest" tag at this build
        if: github.event_name != 'release'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish latest build
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nirvash ${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})
          body: |
            Latest build of `main` (${{ github.sha }}).
            Extract `Nirvash.zip` into `E:\Pictures` so the program sits at `E:\Pictures\Nirvash\App\Nirvash.exe`.
          files: Nirvash.zip
          make_latest: true

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Nirvash.zip
